name: Booking flow audit

on:
  push:
    branches:
      - main
      - lovable-sync
    paths:
      - "src/routes/index.tsx"
      - "src/routes/api.booking.ts"
      - "src/data/booking/**"
      - "src/test/booking-*.test.ts"
      - "src/test/booking-*.mjs"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/booking-audit.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run booking tests
        run: bun test src/test/booking-runtime.test.ts src/test/booking-entrypoints.test.ts src/test/booking-dom.test.ts

      - name: Build
        run: bun run build

      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium

      - name: Run mobile booking browser test
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/booking-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/booking-dev.log
            exit 1
          fi
          node src/test/booking-mobile-browser.mjs
