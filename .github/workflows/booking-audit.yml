name: Booking flow audit

on:
  push:
    branches:
      - main
      - lovable-sync
    paths:
      - "src/routes/index.tsx"
      - "src/routes/api.booking.ts"
      - "src/data/booking/**"
      - "src/test/booking-*.test.ts"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/booking-audit.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run booking tests
        run: bun test src/test/booking-runtime.test.ts src/test/booking-entrypoints.test.ts src/test/booking-dom.test.ts

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: |
          bun add --dev @playwright/test
          bunx playwright install chromium

      - name: Run mobile browser booking test
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/booking-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          bunx playwright test src/test/booking-mobile.e2e.ts --workers=1
