name: Calendar integration verification
on:
  push:
    branches:
      - main
      - feat/complice-lab-google-calendar-20261121
      - feat/calendar-unmatched-reconcile-bidirectional-20261121
  pull_request:
    paths:
      - "src/routes/admin.tsx"
      - "src/lib/*calendar*"
      - "src/routes/api.calendar*"
      - "src/components/crm/**"
      - "src/lib/calendar-review-model.ts"
      - "src/lib/calendar-review.server.ts"
      - "src/test/calendar-review-reconciliation.test.ts"
      - ".github/workflows/calendar-scheduled-sync.yml"
      - "src/test/google-calendar*"
      - "src/test/crm-admin-navigation.test.ts"
      - "supabase/migrations/20261121_*"
      - ".github/workflows/calendar-integration-check.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Calendar matching + availability tests
        run: bun test src/test/google-calendar-server.test.ts src/test/google-calendar-matching.test.ts src/test/crm-admin-navigation.test.ts src/test/calendar-setup-readiness.test.ts src/test/calendar-review-reconciliation.test.ts
      - name: Production build (generates TanStack routes)
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
