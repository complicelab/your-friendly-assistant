name: Booking flow audit

on:
  push:
    branches:
      - main
      - lovable-sync
    paths:
      - "src/routes/index.tsx"
      - "src/routes/api.booking.ts"
      - "src/data/booking/**"
      - "src/test/booking-*.test.ts"
      - "src/test/booking-*.mjs"
      - "src/routeTree.gen.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/booking-audit.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run booking tests
        run: bun test src/test/booking-runtime.test.ts src/test/booking-entrypoints.test.ts src/test/booking-dom.test.ts

      - name: Build
        run: bun run build

      - name: Probe published production
        run: |
          curl -L --fail --silent --show-error https://complicelab.com/ -o /tmp/complicelab-production.html
          echo "PROD_BYTES=$(wc -c < /tmp/complicelab-production.html)"
          if grep -q "Continuar con mis datos" /tmp/complicelab-production.html; then echo "PROD_TWO_STEP_TEXT=YES"; else echo "PROD_TWO_STEP_TEXT=NO"; fi
          if grep -q "cl-mobile-step-data" /tmp/complicelab-production.html; then echo "PROD_TWO_STEP_CLASS=YES"; else echo "PROD_TWO_STEP_CLASS=NO"; fi
          if grep -q "data-cl-step=\\\"schedule\\\"" /tmp/complicelab-production.html; then echo "PROD_STEP_MARKUP=YES"; else echo "PROD_STEP_MARKUP=NO"; fi
          if grep -q "cl-booking-mobile-next" /tmp/complicelab-production.html; then echo "PROD_MOBILE_NEXT=YES"; else echo "PROD_MOBILE_NEXT=NO"; fi

      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Run mobile booking browser test
        run: node src/test/booking-mobile-browser.mjs

      - name: Run production mobile booking probe
        run: node src/test/booking-production-mobile.mjs
