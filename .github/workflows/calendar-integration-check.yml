name: Calendar integration verification
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Calendar matching + availability tests
        run: bun test src/test/google-calendar-server.test.ts src/test/google-calendar-matching.test.ts src/test/crm-admin-navigation.test.ts src/test/calendar-setup-readiness.test.ts src/test/calendar-review-reconciliation.test.ts src/test/calendar-agenda-live.test.ts src/test/google-booking-auto-duration.test.ts
      - name: Production build (generates TanStack routes)
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
