name: Audit WhatsApp IA status and CRM UI
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify WhatsApp audit (data semantics + UI)
        run: bun test src/test/crm-whatsapp-audit.test.ts src/test/crm-admin-navigation.test.ts src/test/crm-agent-attendance.test.ts
      - name: Build with TanStack route generation
        run: bun run build
      - name: Strict type check
        run: bunx tsc --noEmit
